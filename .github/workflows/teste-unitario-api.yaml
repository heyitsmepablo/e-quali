name: Testes Unitarios API
on:
  push:
    paths:
      - "api/**"
  pull_request:
    paths:
      - "api/**"
jobs:
  tests-and-badges:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:cov
