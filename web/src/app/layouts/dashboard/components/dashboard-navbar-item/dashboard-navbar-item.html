<a
  class="flex w-full transition-colors duration-75 ease-in-out text-text-secundary h-12 gap justify-between items-center pl-4 pr-3 focus:outline-none cursor-pointer rounded-lg hover:bg-action-hover"
  [routerLink]="item().children ? null : item().path"
  routerLinkActive
  [routerLinkActiveOptions]="{ exact: item().children ? true : false }"
  #rla="routerLinkActive"
  [ngClass]="{
    'bg-action-focus hover:bg-action-hover': isOpen(),
    'bg-primary-main/8 hover:bg-primary-main/16 ': isActiveParent(),
  }"
  (click)="toggle()"
>
  <div
    [ngClass]="{
      'text-primary-main': isActiveParent(),
      'text-text-primary': isOpen() && !isActiveParent(),
    }"
  >
    <ng-content select="[icon]"> </ng-content>
  </div>

  <span
    class="ml-4 w-full text-start text-sm leading-6 font-normal"
    [ngClass]="{
      'text-primary-main': isActiveParent(),
      'text-text-primary': isOpen() && !isActiveParent(),
    }"
    [class.font-semibold]="isOpen() || isActiveParent()"
    >{{ item().title }}</span
  >
  @if (item().children) {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-4 h-4 transition-transform duration-300"
      [class.-rotate-90]="!isOpen()"
      [class.text-text-primary]="isOpen() && !isActiveParent()"
      [ngClass]="{ 'text-primary-main': isActiveParent() || isOpen() }"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
    </svg>
  }
</a>
@if (item().children) {
  <div
    class="grid transition-[grid-template-rows] duration-300 ease-in-out"
    [class.grid-rows-[0fr]]="!isOpen()"
    [class.grid-rows-[1fr]]="isOpen()"
  >
    <div class="overflow-hidden">
      <ul>
        @for (subItem of item().children; track subItem.path) {
          <li>
            <a
              [routerLink]="[item().path, subItem.path]"
              routerLinkActive
              #rlaSub="routerLinkActive"
              class="leading-6 rounded-lg text-sm pl-4 gap-x-4 pr-3 h-9 flex items-center cursor-pointer hover:bg-action-hover"
              [ngClass]="{
                'text-text-primary font-semibold   ': rlaSub.isActive,
                'text-text-secundary font-normal  ': !rlaSub.isActive,
              }"
            >
              @if (!rlaSub.isActive) {
                <svg
                  class="w-6 h-6"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <circle cx="2" cy="2" r="2" transform="matrix(1 0 0 -1 10 14)" fill="#637381" />
                </svg>
              } @else {
                <svg
                  class="w-6 h-6"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <circle cx="4" cy="4" r="4" transform="matrix(1 0 0 -1 8 16)" fill="#00AB55" />
                </svg>
              }
              <span>{{ subItem.title }}</span>
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
}
