<header
  class="flex w-full justify-between h-16 py-3 px-4 fixed inste-y-0 lg:pr-80 trasition-transparent duration-300 z-20"
  [ngClass]="{
    'bg-grey-100/70 backdrop-blur-sm shadow-sm': isScrolled(),
    'bg-transparent backdrop-blur-none': !isScrolled(),
  }"
>
  <span class="icons-wrapper">
    <button (click)="emitMenuClick()" class="lg:hidden">
      <app-icon-menu class="fill-action-active"></app-icon-menu>
    </button>
    <app-icon-search class="fill-action-active"></app-icon-search>
  </span>
  <span class="icons-wrapper">
    <div class="relative">
      <app-icon-bell class="fill-action-active w-5 h-5"></app-icon-bell>
      <app-bagde class="absolute bottom-3.5 left-3"></app-bagde>
    </div>
  </span>
</header>
