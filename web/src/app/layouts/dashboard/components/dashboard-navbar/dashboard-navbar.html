<nav
  class="nav-wrapper z-50 bg-gray-50 h-full w-72 transition-transform ease-in-out -translate-x-full duration-300 fixed inset-y-0 lg:translate-x-0 lg:border lg:border-action-focus"
  [ngClass]="{ 'translate-x-0': isOpened() }"
>
  <!-- header -->
  <div
    class="flex flex-col w-full h-48 justify-end px-5 relative after:absolute after:inset-0 after:bg-radial-[at_125%_0%] after:from-primary-dark/16 after:to-40% after:lg:opacity-0 after:transition-opacity after:ease-in after:duration-200 after:opacity-100"
  >
    <a class="w-32 mb-8 cursor-pointer z-10" [routerLink]="['/']">
      <img src="assets/png/logo-semus.png" alt="" />
    </a>
    <div class="flex w-60 h-20 mb-4 rounded-xl bg-grey-500/8">
      <img
        src="assets/jpg/avatar-user.jpg"
        alt=""
        class="w-10 h-10 rounded-3xl ml-5 my-[1.13rem]"
      />
      <div class="flex flex-col w-36 my-5 ml-4">
        <p class="text-text-primary font-semibold leading-5 text-sm">
          {{ userData.nome }}
        </p>
        <p class="text-text-disabled font-normal leading-5 text-sm">
          {{ userData.cargo }}
        </p>
      </div>
    </div>
  </div>
  <!--  -->
  <div class="items-wrapper">
    <app-dashboard-subheader title="geral"></app-dashboard-subheader>
    <div class="accordion-item-wrapper">
      <app-dashboard-navbar-item [item]="navbarItems">
        <svg
          icon
          class="w-7 h-7"
          viewBox="0 0 24 24"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            opacity="0.32"
            d="M2.28099 19.6575C2.36966 20.5161 2.93261 21.1957 3.77688 21.3755C5.1095 21.6592 7.6216 22 12 22C16.3784 22 18.8905 21.6592 20.2232 21.3755C21.0674 21.1957 21.6304 20.5161 21.719 19.6575C21.8505 18.3844 22 16.0469 22 12C22 7.95305 21.8505 5.6156 21.719 4.34251C21.6304 3.48389 21.0674 2.80424 20.2231 2.62451C18.8905 2.34081 16.3784 2 12 2C7.6216 2 5.1095 2.34081 3.77688 2.62451C2.93261 2.80424 2.36966 3.48389 2.28099 4.34251C2.14952 5.6156 2 7.95305 2 12C2 16.0469 2.14952 18.3844 2.28099 19.6575Z"

          />

            fill="#currentColor"
          />
        </svg>
      </app-dashboard-navbar-item>
    </div>
  </div>
</nav>
<div
  class="fixed bg-grey-800/48 opacity-0 transition-opacity duration-300 inset-0 z-40 lg:hidden"
  [ngClass]="{
    'opacity-100 pointer-events-auto ': isOpened(),
    'opacity-0 pointer-events-none ': !isOpened(),
  }"
  (click)="requestClose()"
></div>
