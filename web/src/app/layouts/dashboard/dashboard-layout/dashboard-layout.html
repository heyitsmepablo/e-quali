<div class="flex flex-col w-full min-h-screen">
  <app-dashboard-navbar
    class="h-full w-full"
    [isOpened]="navbarOpened()"
    (closeEvent)="closeNavbar()"
  ></app-dashboard-navbar>
  <div class="flex flex-col min-h-screen transition-all duration-300 ease-in-out lg:pl-72">
    <app-dashboard-header (menuClickEvent)="navbarToggle()"></app-dashboard-header>
    <router-outlet class="pt-20"></router-outlet>
  </div>
</div>
