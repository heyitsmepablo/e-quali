<label for="id" class="label text-field" [attr.variant]="variant()" [class.disabled]="disabled">
  <input
    type="text"
    id="id"
    [placeholder]="placeholder()"
    [value]="innerValue"
    (input)="updateValue($event)"
    (blur)="onBlur()"
    [disabled]="disabled"
  />
  <button>olhinho</button>
  @if(hasLabel()){
  <span class="label-text">{{ label() }}</span>
  }
</label>
