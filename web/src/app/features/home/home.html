<main class="flex-col w-full min-h-screen px-6 space-y-6">
  <div
    class="w-full h-80 rounded-3xl bg-linear-to-r from-violet-600 to-blue-500 shadow-lg flex items-center justify-center text-white relative overflow-hidden"
  >
    <div
      class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"
    ></div>
    <div class="z-10 text-center">
      <h1 class="text-4xl font-bold mb-2">Dashboard Semus</h1>
      <p class="text-white/80">Role para baixo para ver o efeito de vidro no header</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (item of [].constructor(20); track $index) {
      <div
        class="p-6 bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow"
      >
        <div class="flex items-center gap-4 mb-4">
          <div
            class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold"
          >
            {{ $index + 1 }}
          </div>
          <div>
            <h3 class="font-bold text-gray-800">Card de Teste</h3>
            <p class="text-sm text-gray-500">Conteúdo demonstrativo</p>
          </div>
        </div>
        <div class="h-2 w-full bg-gray-100 rounded-full mb-2">
          <div class="h-full bg-blue-500 rounded-full" [style.width.%]="$index * 5 + 10"></div>
        </div>
        <p class="text-gray-600 text-sm mt-4">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, voluptatum. Role mais
          para testar o header.
        </p>
      </div>
    }
  </div>
</main>
