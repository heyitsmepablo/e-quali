<div class="px-4 h-full w-full flex-col flex lg:px-10 lg:pb-32 lg:pt-10">
  <div class="flex flex-col lg:flex-row mb-2 gap-4 lg:items-center lg:mb-10">
    <app-breadcrumb></app-breadcrumb>
    <div class="flex w-full justify-end mb-10 lg:mb-0">
      <span class="flex h-9">
        <a [routerLink]="['/usuario/solicitacao', 'criar']">
          <app-button label="Nova Solicitação"
            ><svg
              class="w-5 h-5"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15.8333 9.16634H10.8333V4.16634C10.8333 3.7061 10.4602 3.33301 9.99992 3.33301C9.53968 3.33301 9.16659 3.7061 9.16659 4.16634V9.16634H4.16659C3.70635 9.16634 3.33325 9.53944 3.33325 9.99967C3.33325 10.4599 3.70635 10.833 4.16659 10.833H9.16659V15.833C9.16659 16.2932 9.53968 16.6663 9.99992 16.6663C10.4602 16.6663 10.8333 16.2932 10.8333 15.833V10.833H15.8333C16.2935 10.833 16.6666 10.4599 16.6666 9.99967C16.6666 9.53944 16.2935 9.16634 15.8333 9.16634Z"
                fill="white"
              /></svg
          ></app-button>
        </a>
      </span>
    </div>
  </div>

  <app-table
    [columns]="tableColumns"
    [data]="users()"
    (search)="handleSearch($event)"
    (rowClick)="navigateToDetails($event)"
  >
    <div
      toolbar
      class="flex items-center gap-2 text-text-secondary bg-background-neutral w-full h-12 pl-6"
    >
      <button
        class="px-3 h-full text-sm font-normal cursor-pointer"
        [routerLink]="['/usuario/solicitacao']"
        [routerLinkActiveOptions]="{
          matrixParams: 'ignored',
          queryParams: 'exact',
          paths: 'exact',
          fragment: 'ignored',
        }"
        routerLinkActive="font-semibold border-b-2 border-primary-main !text-text-primary"
      >
        Todos
      </button>
      <button
        class="px-3 h-full text-sm font-semibold text-text-secondary hover:bg-action-hover cursor-pointer"
        (click)="filterStatus('Active')"
        [routerLink]="['/usuario/solicitacao']"
        [queryParams]="{ status: 'active' }"
        routerLinkActive="font-semibold border-b-2 border-primary-main !text-text-primary"
        [routerLinkActiveOptions]="{
          matrixParams: 'ignored',
          queryParams: 'exact',
          paths: 'exact',
          fragment: 'ignored',
        }"
      >
        Ativos
      </button>
      <button
        class="px-3 h-full text-sm font-semibold text-text-secondary hover:bg-action-hover cursor-pointer"
        (click)="filterStatus('Banned')"
        [routerLink]="['/usuario/solicitacao']"
        [queryParams]="{ status: 'banned' }"
        routerLinkActive="font-semibold border-b-2 border-primary-main !text-text-primary"
        [routerLinkActiveOptions]="{
          matrixParams: 'ignored',
          queryParams: 'exact',
          paths: 'exact',
          fragment: 'ignored',
        }"
      >
        Banidos
      </button>
    </div>
    <div toolbar class="relative w-full ml-auto p-5">
      <app-text-field
        placeholder="Search..."
        [ngModel]="searchTerm"
        (ngModelChange)="handleSearch($event)"
        id="searchInputUserTable"
      >
        <svg
          class="h-5 w-5 text-action-active"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </app-text-field>
    </div>
    <ng-template let-user>
      <td class="p-4 text-sm text-gray-500">
        {{ user.id }}
      </td>

      <td class="p-4 whitespace-nowrap pr-10">
        <div class="flex items-center gap-3">
          <img [src]="user.avatarUrl" alt="" class="w-10 h-10 rounded-full object-cover" />
          <div class="flex flex-col">
            <span class="font-semibold text-sm text-gray-900">{{ user.name }}</span>
            <span class="text-xs text-gray-500 sm:hidden">{{ user.email }}</span>
          </div>
        </div>
      </td>

      <td class="p-4 whitespace-nowrap">
        <span class="text-sm text-gray-600">{{ user.company }}</span>
      </td>

      <td class="p-4 whitespace-nowrap">
        <span class="text-sm text-gray-600">{{ user.role }}</span>
      </td>

      <td class="p-4 whitespace-nowrap text-center">
        @if (user.verified) {
          <svg
            class="w-5 h-5 text-action-focus inline-block"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
            />
          </svg>
        } @else {
          <span class="text-gray-300">-</span>
        }
      </td>

      <td class="p-4 whitespace-nowrap">
        <span
          class="px-2.5 py-1 rounded-lg text-xs font-bold inline-flex items-center"
          [ngClass]="{
            'bg-success-main text-green-700': user.status === 'Active',
            'bg-error-main text-red-700': user.status === 'Banned',
          }"
        >
          {{ user.status }}
        </span>
      </td>
    </ng-template>
  </app-table>
</div>
