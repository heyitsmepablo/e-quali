<div class="px-4 h-full w-full flex-col flex">
  <header class="flex flex-col">
    <span class="mb-2 text-xl font-bold leading-8">Solicitações de Usuário</span>
    <app-breadcrumb></app-breadcrumb>
  </header>
  <app-table [columns]="tableColumns" [data]="users()" (search)="handleSearch($event)">
    <div toolbar class="flex items-center gap-2 bg-background-neutral w-full h-12 pl-6">
      <button
        class="px-3 py-2 text-sm font-semibold text-primary-main bg-primary-main/8 rounded-lg transition-colors"
      >
        All
      </button>
      <button
        class="px-3 py-2 text-sm font-semibold text-text-secundary hover:bg-gray-50 rounded-lg transition-colors"
      >
        Active
      </button>
      <button
        class="px-3 py-2 text-sm font-semibold text-text-secundary hover:bg-gray-50 rounded-lg transition-colors"
      >
        Banned
      </button>
    </div>
    <div toolbar class="relative w-full ml-auto p-5">
      <app-text-field
        placeholder="Search..."
        [ngModel]="searchTerm"
        (ngModelChange)="handleSearch($event)"
      >
        <svg
          class="h-5 w-5 text-action-active"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </app-text-field>
    </div>
    <ng-template let-user>
      <td class="py-4 px-4 whitespace-nowrap">
        <div class="flex items-center gap-3">
          <img [src]="user.avatarUrl" alt="" class="w-10 h-10 rounded-full object-cover" />
          <div class="flex flex-col">
            <span class="font-semibold text-sm text-gray-900">{{ user.name }}</span>
            <span class="text-xs text-gray-500 sm:hidden">{{ user.email }}</span>
          </div>
        </div>
      </td>

      <td class="py-4 px-4 whitespace-nowrap">
        <span class="text-sm text-gray-600">{{ user.company }}</span>
      </td>

      <td class="py-4 px-4 whitespace-nowrap">
        <span class="text-sm text-gray-600">{{ user.role }}</span>
      </td>

      <td class="py-4 px-4 whitespace-nowrap text-center">
        @if (user.verified) {
          <svg
            class="w-5 h-5 text-action-focus inline-block"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
            />
          </svg>
        } @else {
          <span class="text-gray-300">-</span>
        }
      </td>

      <td class="py-4 px-4 whitespace-nowrap">
        <span
          class="px-2.5 py-1 rounded-lg text-xs font-bold inline-flex items-center"
          [ngClass]="{
            'bg-green-100 text-green-700': user.status === 'Active',
            'bg-red-100 text-red-700': user.status === 'Banned',
          }"
        >
          {{ user.status }}
        </span>
      </td>

      <td class="py-4 px-4 whitespace-nowrap text-right">
        <button
          class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-2 rounded-full transition-colors focus:outline-none"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"
            />
          </svg>
        </button>
      </td>
    </ng-template>
  </app-table>
</div>
