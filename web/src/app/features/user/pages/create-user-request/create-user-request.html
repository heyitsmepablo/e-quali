<div class="px-4 h-full w-full flex-col flex lg:px-10 lg:pb-32 lg:pt-10">
  <app-breadcrumb></app-breadcrumb>

  <div class="flex w-full h-full justify-center">
    <form
      method="post"
      class="flex flex-col w-full h-full p-6 mb-6 items-end shadow-card lg:items-center lg:w-3xl"
    >
      <div class="flex size-full gap-6 flex-col pb-6">
        <div class="flex flex-col gap-6 lg:flex-row">
          <app-text-field
            [hasLabel]="true"
            label="Nome Completo"
            id="nome_completo"
            class="lg:w-1/2"
          ></app-text-field>
          <app-text-field
            class="lg:w-1/2"
            [hasLabel]="true"
            label="Matrícula"
            id="matricula"
          ></app-text-field>
        </div>
        <div class="flex flex-col gap-6 lg:flex-row">
          <app-text-field
            class="lg:w-1/2"
            [hasLabel]="true"
            label="Data de Nascimento"
            id="data_nascimento"
          ></app-text-field>
          <app-text-field class="lg:w-1/2" [hasLabel]="true" label="CPF" id="cpf"></app-text-field>
        </div>
        <div class="flex flex-col gap-6 lg:flex-row">
          <app-text-field
            class="lg:w-1/2"
            [hasLabel]="true"
            label="E-mail"
            id="e-mail"
          ></app-text-field>
          <app-text-field
            class="lg:w-1/2"
            [hasLabel]="true"
            label="Telefone"
            id="tel"
          ></app-text-field>
        </div>
        <div class="flex flex-col gap-6 lg:flex-row">
          <app-select class="lg:w-1/2" label="Unidade"> </app-select>
          <app-select class="lg:w-1/2" label="Setor"> </app-select>
        </div>
        <div class="div flex flex-col gap-6 lg:flex-row">
          <app-select class="lg:w-1/2" label="Area"> </app-select>
          <app-select class="lg:w-1/2" label="Cargo"> </app-select>
        </div>
        <app-text-area
          id="text-area"
          [hasLabel]="true"
          label="Detalhes da Solicitação"
        ></app-text-area>
      </div>
      <div class="flex justify-between w-full">
        <a href="" [routerLink]="['/usuario', 'solicitacao']">
          <app-button label="Voltar" variant="outlined" color="inherit"></app-button>
        </a>

        <app-button label="Criar Solicitação"></app-button>
      </div>
    </form>
  </div>
</div>
