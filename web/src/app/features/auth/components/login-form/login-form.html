<form class="form-wrapper">
  <div class="head">
    <h1 class="text-2xl text-text-primary font-bold leading-9 not-italic">Entrar no e-Quali</h1>
    <h2 class="text-right text-sm text-text-primary not-italic font-normal leading-[1.38rem]">
      Usuario novo?
      <a href="" class="text-primary-main text-sm not-italic font-semibold leading-[1.38rem]"
        >Solicite acesso</a
      >
    </h2>
  </div>
  <form class="content" [formGroup]="loginForm" (submit)="onSubmit()">
    <div class="flex flex-col w-full">
      <app-text-field
        formControlName="cpf"
        [hasLabel]="true"
        label="CPF"
        id="cpf"
        name="cpf"
        class="w-full"
        mask="000.000.000-00"
        [dropSpecialCharacters]="true"
        [specialCharacters]="['.', '-']"
      ></app-text-field>
      @if ( cpfShouldShowError ) {
      <small class="text-error-main">Insira um cpf valido.</small>
      }
    </div>
    <app-text-field
      formControlName="password"
      [hasLabel]="true"
      label="Senha"
      [showPasswordToggle]="true"
      type="password"
      id="senha"
      name="senha"
      class="w-full"
    ></app-text-field>
    <span class="flex w-full justify-end">
      <a
        class="text-right text-sm underline font-normal leading-[1.38rem] decoration-auto underline-offset-auto decoration-solid hover:cursor-pointer"
        >Esqueceu a senha?</a
      >
    </span>
    <button class="button-login">Login</button>
  </form>
</form>
