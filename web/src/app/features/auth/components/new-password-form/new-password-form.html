<div class="form-wrapper">
  <app-icon-email-sent></app-icon-email-sent>
  <div class="head">
    <h1>Redefina sua senha</h1>
    <h2>Por favor, redefina sua senha.</h2>
  </div>
  <app-text-field
    label="Nova Senha"
    [hasLabel]="true"
    id="nova-senha"
    name="nova-senha"
    [showPasswordToggle]="true"
    type="password"
    class="w-100"
  ></app-text-field>
  <app-text-field
    label="Confirmar Nova Senha"
    [hasLabel]="true"
    id="confirmar"
    [showPasswordToggle]="true"
    type="password"
    class="w-100"
  ></app-text-field>
  <app-button label="Atualizar Senha" class="w-100 h-12"></app-button>
  <span class="link"
    ><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M9.21978 12.6667C9.01806 12.6673 8.82687 12.5767 8.69978 12.42L5.47978 8.41999C5.27757 8.17399 5.27757 7.81933 5.47978 7.57332L8.81312 3.57332C9.04876 3.28982 9.46961 3.25102 9.75312 3.48666C10.0366 3.7223 10.0754 4.14315 9.83978 4.42666L6.85978 7.99999L9.73978 11.5733C9.90625 11.7731 9.94132 12.0515 9.82961 12.2864C9.71791 12.5212 9.47983 12.6697 9.21978 12.6667Z"
        fill="#212B36"
      />
    </svg>
    Retornar para login</span
  >
</div>
