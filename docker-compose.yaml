name: e-quali
services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    mem_limit: "512mb"
    cpus: "0.50"
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    networks:
      - e-quali
  pgadmin4:
    image: dpage/pgadmin4:latest
    ports:
      - 8080:80
    volumes:
      - ./docker/pgadmin/data:/var/lib/pgadmin/data
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@admin.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    mem_limit: "2gb"
    cpus: "1"
    networks:
      - e-quali
  # api:
  #   depends_on:
  #     - database
  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile.dev
  #   ports:
  #     - 3000:3000
  #   volumes:
  #     - ./api:/app
  #   command: sh -c "npx prisma db pull && npx prisma generate && npm run start:dev"
  #   mem_limit: "2gb"
  #   cpus: "1"
  #   env_file:
  #     - ./api/.env
  #   networks:
  #     - e-quali
networks:
  e-quali:
    driver: bridge